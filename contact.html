<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- SEO Meta Tags -->
  <meta name="description" content="Contact the Encrypz team for support, business inquiries, or questions about our zero-knowledge encryption.">
  <meta name="keywords" content="contact encrypz, support, zero knowledge, client-side encryption">
  <meta name="author" content="Encrypz">
  <meta property="og:title" content="Contact Us - Encrypz">
  <meta property="og:description" content="Contact the Encrypz team for support, business inquiries, or questions about our zero-knowledge encryption.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#020d1c">
  
  <link rel="icon" type="image/png" href="/icon.png" />
  <title>Contact Us - Encrypz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Preload Critical CSS -->
  <link rel="preload" href="./src/style.css" as="style">
  <link rel="stylesheet" href="./src/style.css" />
  <style>
    .page-content {
      padding: 10rem 0 6rem 0;
      max-width: 800px;
      margin: 0 auto;
    }
    .page-content h1 {
      margin-bottom: 2rem;
      font-size: 3rem;
    }
    .page-content p {
      margin-bottom: 2.5rem;
      color: var(--text-muted);
      line-height: 1.8;
    }
    
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      background: var(--bg-color-alt);
      padding: 3rem;
      border-radius: var(--border-radius-lg);
      border: 1px solid var(--border-color);
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    
    .form-group label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-dark);
    }
    
    .form-group input, 
    .form-group textarea {
      padding: 1rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-dark);
      font-family: inherit;
    }
    
    .form-group input:focus, 
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(0, 180, 216, 0.2);
    }
    
    .btn-submit {
      margin-top: 1rem;
      align-self: flex-start;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- Floating Nav -->
  <nav class="navbar" id="navbar">
    <div class="nav-content">
      <a href="/" class="logo">
        <img src="/logo.png" alt="Encrypz Logo" class="logo-icon"
          style="height: 32px; width: auto; border-radius: 4px;" />
        <span class="logo-text">Encrypz</span>
      </a>
      <div class="nav-links">
        <a href="/#features">Features</a>
        <a href="/#how-it-works">How It Works</a>
        <a href="/#security">Security</a>
      </div>
      <div class="nav-actions">
        <a href="#" class="nav-login">Log In</a>
        <a href="#" class="btn-glow">Sign Up</a>
      </div>
    </div>
  </nav>

  <section class="page-content container">
    <h1 class="text-gradient">Contact Us</h1>
    
    <p>Have a question about our encryption architecture? Need help setting up your cloud provider? We're here to help.</p>

    <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent successfully!');">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name" required />
      </div>
      
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" placeholder="How can we help?" required />
      </div>
      
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="Your message here..." required></textarea>
      </div>
      
      <button type="submit" class="btn-primary btn-submit">Send Message</button>
    </form>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <img src="/logo.png" alt="Encrypz Logo" class="logo-icon"
            style="height: 32px; width: auto; border-radius: 4px;" />
          <span class="logo-text">Encrypz</span>
        </div>
        <div class="footer-links">
          <a href="https://github.com/encrypz/" target="_blank">GitHub</a>
          <a href="/about.html">About Us</a>
          <a href="/contact.html">Contact Us</a>
          <a href="/privacy.html">Privacy Policy</a>
          <a href="/terms.html">Terms of Service</a>
        </div>
      </div>
      <div class="footer-bottom">
        <p>Copyright &copy; 2026 Encrypz. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
